<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>八景島 Fish Guide</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

  <header class="app-header">

    <div>
      <p class="small-title">HAKKEIJIMA FISH GUIDE</p>

      <h1>
        今日は、どの魚を<br>
        深く知る？
      </h1>
    </div>

    <div class="logo-icon">
      魚
    </div>

  </header>


  <main>

    <!-- 検索 -->
    <div class="search-box">

      <span class="search-icon">⌕</span>

      <input
        type="text"
        placeholder="魚の名前を検索"
      >

    </div>


    <!-- 場所から探す -->
    <button class="main-button place-button">

      <div class="button-icon">
        📍
      </div>

      <div class="button-text">

        <span>
          いま水族館にいるなら
        </span>

        <strong>
          場所から探す
        </strong>

        <small>
          施設 → LABO → 魚
        </small>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- 魚から探す -->
    <button class="main-button fish-button">

      <div class="button-icon">
        🔍
      </div>

      <div class="button-text">

        <span>
          名前が分かるなら
        </span>

        <strong>
          魚から探す
        </strong>

        <small>
          和名・学名・英名から検索
        </small>

      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- サイト紹介 -->
    <section class="feature-section">

      <h2>
        この図鑑で深く知る
      </h2>

      <div class="feature-grid">

        <div class="feature-card">
          <span>01</span>
          <strong>分類</strong>
          <small>どんな仲間？</small>
        </div>

        <div class="feature-card">
          <span>02</span>
          <strong>豆知識</strong>
          <small>面白い情報</small>
        </div>

        <div class="feature-card">
          <span>03</span>
          <strong>生態</strong>
          <small>どう暮らす？</small>
        </div>

        <div class="feature-card">
          <span>04</span>
          <strong>観察</strong>
          <small>どこを見る？</small>
        </div>

      </div>

    </section>

  </main>


  <footer>

    <button>
      <span>⌂</span>
      ホーム
    </button>

    <button>
      <span>📍</span>
      場所
    </button>

    <button>
      <span>⌕</span>
      魚
    </button>

  </footer>
<script src="location-data.js"></script>
<script src="fish-data.js"></script>
<script src="app.js"></script>

</body>
</html>
